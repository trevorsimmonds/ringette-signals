<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ringette Signals</title>
  <meta name="description" content="Every on-ice official's signal in ringette, animated, with a link to the rule in Ringette Canada's rulebook.">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" width="28" height="28">
      <h1>Ringette Signals</h1>
    </div>
    <button id="startBtn" class="top-btn" aria-label="View one at a time">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      One at a time
    </button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-cat="all" aria-selected="true">All <span class="pill" id="nAll"></span></button>
    <button role="tab" data-cat="general" aria-selected="false">General <span class="pill" id="nGen"></span></button>
    <button role="tab" data-cat="penalty" aria-selected="false">Penalties <span class="pill" id="nPen"></span></button>
  </nav>

  <main>
    <input id="search" class="search" type="search" placeholder="Search signals" autocomplete="off" aria-label="Search signals">
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>No signals match that search.</p>
    <p class="muted small foot">Signals from Ringette Canada's <a id="bookLink" target="_blank" rel="noopener">Official Rules &amp; Case Book 2025–2027</a>, Annex C. Illustrations are unofficial.</p>
  </main>

  <div id="viewer" class="viewer" hidden aria-modal="true" role="dialog" aria-labelledby="vName">
    <header class="topbar vbar">
      <button id="vClose" class="icon-btn" aria-label="Back to list">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
      </button>
      <span id="vCount" class="vcount"></span>
      <button id="vQuiz" class="top-btn ghost" aria-pressed="false">Hide names</button>
    </header>
    <div class="vbody">
      <div class="vstage" id="vStage">
        <svg id="vSvg" role="img"></svg>
        <span class="speed" id="vSpeed">1×</span>
        <button class="nav prev" id="vPrev" aria-label="Previous signal">‹</button>
        <button class="nav next" id="vNext" aria-label="Next signal">›</button>
      </div>
      <div class="vinfo">
        <span id="vCat" class="chip"></span>
        <h2 id="vName"></h2>
        <button id="vReveal" class="reveal" hidden>Tap to reveal</button>
        <div id="vMeansWrap" class="means"><h3>What it means</h3><p id="vMeans"></p></div>
        <h3 id="vHowH" class="howh">How it's done</h3>
        <p id="vHow"></p>
        <div id="vRules" class="rules"></div>
        <div class="ctrls">
          <button id="vPlay">Pause</button>
          <button id="vSlow" class="sec">Slow motion</button>
        </div>
        <p class="muted small swipe">Swipe or use ‹ › to move between signals.</p>
      </div>
    </div>
  </div>

  <script src="rig.js"></script>
  <script src="signals.js"></script>
  <script src="app.js"></script>
</body>
</html>
